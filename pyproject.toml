[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "wp-enlighten" # enlighten was taken :-(
version = "4.3.1"
dependencies = [
    "2to3",
    "adafruit-blinka",
    "ai_edge_litert",
    "bleak",
    "boto3",
    "build", # for developers, not users
    "colour-science",
    "colour",
    "crcmod",
    "libusb",
    "matplotlib",
    "numpy ; sys_platform == 'win32'",
    "numpy<2.0 ; sys_platform != 'win32'",
    "pandas",
    "pefile",
    "pexpect",
    "pip",
    "psutil",
    "pyftdi",
    "pygtail",
    "pyinstaller ; sys_platform == 'win32'", # for buildling Windows installers
    "pyqtgraph ",
    "pyserial",
    "PySide6",
    "pytest",
    "pyusb",
    "pywavelets",
    "qimage2ndarray",
    "scipy",
    "SPyC_Writer",
    "superman",
    "wasatch",
    "xlwt",

    "pywin32   ; sys_platform == 'win32'",
    "ids_peak  ; sys_platform == 'win32'", # TODO: check for other platforms
    "seabreeze ; sys_platform == 'win32'", # TODO: check for other platforms
]

authors = [
  { name="Mark Zieg", email="mzieg@wasatchphotonics.com" },
  { name="Chris Grainger", email="cgrainger@wasatchphotonics.com" },
]

readme = "README.md"
description = "A GUI to control and collect data from Wasatch Photonics spectrometers"
requires-python = ">=3.11,<3.15"    # MZ: problems finding ai_edge_litert wheel on MacOS with Python 3.15
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = [ "LICEN[CS]E*" ]

keywords = [ "wasatch", "wasatchphotonics", "spectrometer", "raman" ]

[project.gui-scripts]
enlighten = "wp_enlighten.app:main" # tells hatchling to generate venv/bin/enlighten running wp_enlighten.app.main()

[project.urls]
Issues = "https://github.com/WasatchPhotonics/ENLIGHTEN/issues"
Homepage = "https://wasatchphotonics.com/enlighten"
Changelog = "https://github.com/WasatchPhotonics/ENLIGHTEN/blob/master/CHANGELOG.md"
Repository = "https://github.com/WasatchPhotonics/ENLIGHTEN.git"
Documentation = "https://wasatchphotonics.com/enlighten"
